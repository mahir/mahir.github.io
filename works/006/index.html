  // Each letter is a few centerline polylines in a w × h box. Open ends get extended to the box's edge later.
  function glyph(ch, w, h) {

      case 'I': return [o([c, t], [c, b])];

      case 'K': return [o([l, t], [l, b]), o([r, t], [r, t + 1], [l + S, m], [r, b - 1], [r, b])];

      case 'N': return [o([l, b], [l, t]), x([l, t], [r, b]), o([r, b], [r, t])];
      case 'O': return [z([l, t], [r, t], [r, b], [l, b])];

    rows.forEach((row, ri) => {
      // widen the letters of a shorter row, up to twice their width, and center what is left
      let extra = width - row.width;
      for (let pass = 0; pass < 6 && extra > 1e-3; pass++) {
        const open = row.letters.filter((L) => L.ch !== 'I' && L.w < WIDTH[L.ch] * 2);
        const total = open.reduce((s, L) => s + L.w, 0);
        if (!total) break;
        const share = extra / total;
        for (const L of open) { const add = Math.min(L.w * share, WIDTH[L.ch] * 2 - L.w); L.w += add; extra -= add; }
      }
      let x = extra / 2;
      for (const L of row.letters) { L.x = x; x += L.w + G; }
      const { short, claims } = nest(row.letters, H);
      const y0 = ri * (H + lineGap);
      row.letters.forEach((L, i) => {
        const h = short[i] ? H - 2 * D : H;
        const paths = glyph(L.ch, L.w, h);
        const t = S / 2, b = h - S / 2;
        const reach = {};
        for (const c of claims.filter((c) => c.from === i)) {
          const over = row.letters[c.over];
          reach[c.id] = (c.over > i ? over.x + over.w : over.x) - L.x;
        }
        const serifs = [];
        for (const [pi, p] of paths.entries()) {
          if (p.over) {
            const [a, z] = [p.pts[0], p.pts[p.pts.length - 1]], len = Math.hypot(z[0] - a[0], z[1] - a[1]);
            const ux = (z[0] - a[0]) / len * 2, uy = (z[1] - a[1]) / len * 2;
            p.pts = [[a[0] - ux, a[1] - uy], ...p.pts.slice(1, -1), [z[0] + ux, z[1] + uy]];
            continue;
          }
          if (p.closed) continue;
          for (const end of [0, 1]) {
            const pts = p.pts;
            const a = end ? pts.length - 1 : 0, prev = end ? pts.length - 2 : 1;
            const [x, y] = pts[a], [px, py] = pts[prev];
            const id = pi + ':' + end;
            if (id in reach) {
              const turn = [reach[id], y];
              if (end) pts.push(turn); else pts.unshift(turn);
              continue;
            }
            const len = Math.hypot(x - px, y - py), ux = (x - px) / len, uy = (y - py) / len;
            if (!near(ux, 0) && !near(uy, 0)) continue;
            pts[a] = [x + ux * S / 2, y + uy * S / 2];
            // a slab serif where a stem stops at the top or the bottom
            if (near(ux, 0) && ((near(y, t) && uy < 0) || (near(y, b) && uy > 0))) {
              serifs.push({ x: x - S / 2 - SERIF, y: uy < 0 ? 0 : h - SERIF_H, w: S + 2 * SERIF, h: SERIF_H, end });
              serifs[serifs.length - 1].path = pi;
            }
          }
        }
        const reaches = Object.values(reach);
        const clip = [Math.min(0, ...reaches), Math.max(L.w, ...reaches)];
        marks.push({ x: L.x, y: y0 + (short[i] ? D : 0), h, clip, paths, serifs });
      });
    });
    return { marks, width, height: rows.length * H + (rows.length - 1) * lineGap };
  }

  // On a tall, narrow page a long word breaks in two, where its parts meet if it has any (WILLIAMS·BURG).
  const ENDS = ['burg', 'point', 'wick', 'bush', 'town', 'ville', 'wood', 'side', 'hurst', 'dale', 'bridge', 'haven',
    'hill', 'port', 'ridge', 'park', 'stone', 'bank', 'lawn', 'way', 'more', 'rose', 'mont', 'ham', 'ton', 'ford'];
  function halve(word) {
    if (word.length < 8) return [word];
    const end = ENDS.find((e) => word.toLowerCase().endsWith(e) && word.length - e.length >= 3);
    const at = end ? word.length - end.length : Math.ceil(word.length / 2);
    return [word.slice(0, at), word.slice(at)];
  }

  // Pick the letter height, and on a narrow page whether to break long words, that lets the name fill the most of the page.
  function fit(words, boxW, boxH) {
    let best = null;
    const options = [words];
    if (boxW < boxH * 1.2) options.push(words.flatMap(halve));
    for (const lines of options) for (let H = 9; H <= 14; H++) {
      const L = layout(lines, H);
      const scale = Math.min(boxW / L.width, boxH / L.height);
      const area = scale * scale * L.width * L.height;
      if (!best || area > best.area * 1.02) best = { ...L, scale, area };
    }
    return best;
  }

  /* ---------- drawing ---------- */
  const svg = document.getElementById('art'), where = document.getElementById('where'), clock = document.getElementById('clock');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const pathLength = (pts, closed) => {
    let s = 0; const all = closed ? [...pts, pts[0]] : pts;
    for (let i = 1; i < all.length; i++) s += Math.hypot(all[i][0] - all[i - 1][0], all[i][1] - all[i - 1][1]);
    return s;
  };
  const f = (v) => +v.toFixed(3);

  let current = null, order = [], at = 0, timers = [], animations = [];

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const slug = (s) => s.toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-|-$/g, '');

  function box() {
    const narrow = innerWidth < 560;
    const padX = Math.max(20, innerWidth * (narrow ? .06 : .1));
    const top = narrow ? 120 : 110, bottom = narrow ? 120 : 130;
    return [Math.max(120, innerWidth - 2 * padX), Math.max(120, innerHeight - top - bottom), (top - bottom) / 2];
  }

  function render(place, animate) {
    const [name, borough] = place;
    const words = name.toUpperCase().replace(/[^A-Z ]+/g, ' ').trim().split(/\s+/);
    const [bw, bh, shift] = box();
    const L = fit(words, bw, bh);
    svg.setAttribute('viewBox', `0 0 ${f(L.width)} ${f(L.height)}`);
    svg.setAttribute('width', f(L.width * L.scale));
    svg.setAttribute('height', f(L.height * L.scale));
    svg.style.transform = `translateY(${shift}px)`;
    svg.textContent = '';

    const strokes = [];
    const defs = el('defs', {});
    svg.append(defs);
    for (const [mi, m] of L.marks.entries()) {
      // each letter is cut by its own box, so diagonals and sharp joins end square
      const clip = el('clipPath', { id: 'c' + mi });
      clip.append(el('rect', { x: f(m.clip[0]), y: 0, width: f(m.clip[1] - m.clip[0]), height: f(m.h) }));
      defs.append(clip);
      const g = el('g', { transform: `translate(${f(m.x)} ${f(m.y)})`, 'clip-path': `url(#c${mi})` });
      const els = m.paths.map((p) => {
        const d = 'M' + p.pts.map(([x, y]) => `${f(x)} ${f(y)}`).join('L') + (p.closed ? 'Z' : '');
        const e = el('path', { d, 'stroke-width': S, pathLength: 1 });
        g.append(e);
        return e;
      });
      const serifEls = m.serifs.map((s) => { const e = el('rect', { x: f(s.x), y: f(s.y), width: f(s.w), height: f(s.h) }); g.append(e); return e; });
      svg.append(g);
      m.paths.forEach((p, i) => strokes.push({
        el: els[i], len: pathLength(p.pts, p.closed),
        serifs: m.serifs.map((s, si) => s.path === i ? { el: serifEls[si], end: s.end } : null).filter(Boolean),
      }));
    }
    current = { strokes };
    svg.setAttribute('aria-label', name);
    if (!animate) return;

    // one stroke after another, the next starting as the last one lands, like a pen that barely lifts
    let t = 300;
    const plan = strokes.map((s) => { const dur = 260 + s.len * 42; const start = t; t += dur * .82; return { start, dur }; });
    const k = Math.min(1, 6200 / (t + 300));
    strokes.forEach((s, i) => {
      const start = plan[i].start * k, dur = plan[i].dur * k;
      s.el.style.strokeDasharray = '1 1';
      animations.push(s.el.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
        { duration: dur, delay: start, easing: 'cubic-bezier(.45, .05, .35, 1)', fill: 'both' }));
      for (const sf of s.serifs) {
        animations.push(sf.el.animate([{ transform: 'scaleX(0)', opacity: 0 }, { transform: 'none', opacity: 1 }],
          { duration: 240, delay: start + (sf.end ? dur * .92 : 0), easing: 'cubic-bezier(.2, .7, .1, 1)', fill: 'both' }));
      }
    });
  }

  function erase() {
    if (!current) return;
    const n = current.strokes.length;
    current.strokes.forEach((s, i) => {
      const delay = (i / n) * 700;
      animations.push(s.el.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: -1 }],
        { duration: 520, delay, easing: 'cubic-bezier(.55, 0, .7, .3)', fill: 'forwards' }));
      for (const sf of s.serifs) animations.push(sf.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: delay + 200, fill: 'forwards' }));
    });
    where.classList.add('out');
  }

  function show(place) {
    timers.forEach(clearTimeout); timers = [];
    animations.forEach((a) => a.cancel()); animations = [];
    const [name, borough] = place;
    where.innerHTML = '';
    const b = document.createElement('b'); b.textContent = name;
    const s = document.createElement('span'); s.textContent = ' · ' + borough;
    where.append(b, s);
    where.classList.remove('out');
    history.replaceState(null, '', '#' + slug(name));
    paint(still ? 0 : tint + at);
    // ?still draws the name at once and keeps it, for the share image
    if (still) { render(place, false); return; }
    if (reduceMotion) {
      render(place, false);
      svg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, fill: 'both' });
    } else {
      render(place, true);
      timers.push(setTimeout(erase, CYCLE - 1300));
    }
    clock.getAnimations().forEach((a) => a.cancel());
    clock.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: CYCLE, easing: 'linear', fill: 'forwards' });
    timers.push(setTimeout(next, CYCLE));
  }

  // the k-th name takes the k-th ground: two names per ink, then on to the next pair
  const tint = Math.floor(Math.random() * PAIRS.length) * 2;
  const albers = document.getElementById('albers').children;
  const theme = document.querySelector('meta[name="theme-color"]');
  function paint(k) {
    const pair = PAIRS[Math.floor(k / 2) % PAIRS.length], side = k % 2;
    const root = document.documentElement.style;
    root.setProperty('--paper', pair.grounds[side]);
    root.setProperty('--ink', pair.ink);
    theme.content = pair.grounds[side];
    [...albers].forEach((sq, i) => {
      sq.style.background = pair.grounds[i];
      sq.firstChild.style.background = pair.ink;
      sq.classList.toggle('on', i === side);
    });
  }

  function next() { at = (at + 1) % order.length; show(order[at]); }

  // a name in the address starts there; otherwise a random walk through all of them
  order = shuffle(PLACES.slice());
  const asked = PLACES.find((p) => slug(p[0]) === location.hash.slice(1));
  if (asked) { order.splice(order.indexOf(asked), 1); order.unshift(asked); }
  show(order[0]);

  document.getElementById('stage').addEventListener('click', next);
  addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); } });
  // a hidden tab lets its timers drift; start the name over when it comes back
  document.addEventListener('visibilitychange', () => { if (!document.hidden) show(order[at]); });
  let resizing;
  addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(() => current && render(order[at], false), 150); });
})();
</script>
</body>
</html>
