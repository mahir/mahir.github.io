<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<title>No. 017 · contact sheet (build only)</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Red+Hat+Mono:wght@300;400&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Build only: the cards in page order, to judge the rag and the palette together. Each card has its number and id under it.
     ?from=0&to=24 shows a slice; ?cols=6&w=300 sets the grid (defaults: every card, 9 across at 240px). */
  body { padding: 24px; }
  .sheet { display: grid; grid-template-columns: repeat(var(--c, 9), var(--w, 240px)); gap: 28px 20px; }
  .sheet figcaption { margin-top: 6px; font: 400 11px/1.3 var(--mono); color: var(--soft); overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const sheet = document.getElementById('sheet');
  if (q.has('cols')) sheet.style.setProperty('--c', q.get('cols'));
  if (q.has('w')) sheet.style.setProperty('--w', q.get('w') + 'px');
  const html = await (await fetch('index.html', { cache: 'no-store' })).text();
  const all = [...new DOMParser().parseFromString(html, 'text/html').querySelectorAll('.wall .tile')];
  const from = parseInt(q.get('from') || 0), tiles = all.slice(from, q.has('to') ? parseInt(q.get('to')) : undefined);
  await Promise.all(['400 40px "EB Garamond"', 'italic 400 40px "EB Garamond"', '300 10px "Red Hat Mono"'].map(f => document.fonts.load(f, tiles.map(t => t.textContent).join(' '))));
  tiles.forEach((t, i) => {
    const fig = document.createElement('figure'); fig.style.margin = 0;
    const cap = document.createElement('figcaption'); cap.textContent = `${from + i + 1} · ${t.id}`;
    fig.append(document.importNode(t.querySelector('.card'), true), cap);
    sheet.append(fig);
  });
})();
</script>
</body>
</html>
