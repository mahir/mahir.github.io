<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<title>No. 017 · share image (build only)</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Red+Hat+Mono:wght@300;400&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Build only: og.jpg is a screenshot of this page at 1200 x 630. Real cards laid out on the page's paper ground, with
     the page's air between them: the reference card (deep lapis, paper ink) whole at top left, then the shortest saying
     of each other theme. The right and bottom edges crop, so the table reads as going on. */
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); }
  .og { position: absolute; left: 56px; top: 56px; width: 1460px; display: grid; grid-template-columns: repeat(4, 316px); gap: 48px; }
</style>
</head>
<body>
<div class="og" id="og"></div>
<script>
(async () => {
  const html = await (await fetch('index.html', { cache: 'no-store' })).text();
  const tiles = [...new DOMParser().parseFromString(html, 'text/html').querySelectorAll('.wall .tile')];
  const words = t => t.querySelector('.q').textContent.trim().split(/\s+/).length;
  const field = t => (t.querySelector('.card').getAttribute('style').match(/--f:(#[0-9a-f]{6})/) || [])[1];
  // the lead: the lapis card with paper ink, #2748bf
  const lead = tiles.find(t => field(t) === '#2748bf' && t.dataset.variant === 'deep') || tiles[0];
  const pick = [lead];
  // then a short saying of each other theme, in the page's theme order from the lead on
  const themes = [...new Set(tiles.map(t => t.dataset.theme))];
  const at = themes.indexOf(lead.dataset.theme);
  for (const theme of themes.slice(at + 1).concat(themes.slice(0, at)))
    pick.push(tiles.filter(t => t.dataset.theme === theme).sort((a, b) => words(a) - words(b))[0]);
  const og = document.getElementById('og');
  const text = tiles.map(t => t.textContent).join(' ');
  await Promise.all(['400 40px "EB Garamond"', 'italic 400 40px "EB Garamond"', '300 10px "Red Hat Mono"'].map(f => document.fonts.load(f, text)));
  for (const t of pick.slice(0, 8)) og.append(document.importNode(t.querySelector('.card'), true));
  await document.fonts.ready;
})();
</script>
</body>
</html>
