            <blockquote class="q"><p><span class="ln">“When your</span> <span class="ln">heart tightens,</span> <span class="ln"><em>see the opening</em></span> <span class="ln"><em>inside it</em>.”</span></p></blockquote>
            <span class="ft" aria-hidden="true"><span>RUMI</span><span>PATIENCE</span></span>

          <figcaption class="src">
            <p class="src-who"><span class="src-author">Rumi</span> <span class="src-dates">1207–1273</span></p>
            <p class="src-work"><cite>Masnavi</cite>, Book III, Mary and the Holy Spirit (Ganjoor III §179, couplet 40; c. III.3726–3739)</p>
            <p class="src-orig" lang="fa" dir="rtl">چونک قبض آید تو در وی بسط بین</p>
            <p class="src-note">The couplet goes on: “stay fresh, and do not knit your brow”. Qabz and bast, tightening and opening, are Sufi terms for the heart’s contraction and expansion.</p>
            <p class="src-theme">Patience</p>
            <p class="src-link"><a href="https://ganjoor.net/moulavi/masnavi/daftar3/sh179" rel="noopener">Source</a></p>

            <blockquote class="q"><p><span class="ln">“The children of</span> <span class="ln">Adam are limbs of one</span> <span class="ln">another, made of one</span> <span class="ln">essence. When one</span> <span class="ln">limb aches, the others</span> <span class="ln">cannot rest. If you feel</span> <span class="ln">nothing at others’</span> <span class="ln">pain, you <em>do not deserve</em></span> <span class="ln"><em>the name human</em>.”</span></p></blockquote>
            <span class="ft" aria-hidden="true"><span>SAADI</span><span>OTHERS</span></span>
          </a>
          <figcaption class="src">
            <p class="src-who"><span class="src-author">Saadi</span> <span class="src-dates">c. 1210–1291</span></p>
            <p class="src-work"><cite>Gulistan</cite>, chapter I, story 10</p>
            <p class="src-orig" lang="fa" dir="rtl">بنی آدم اعضای یکدیگرند<br>که در آفرینش ز یک گوهرند<br>چو عضوی به درد آورد روزگار<br>دگر عضوها را نماند قرار<br>تو کز محنت دیگران بی‌غمی<br>نشاید که نامت نهند آدمی</p>
            <p class="src-note">Some modern printings read “<bdi dir="rtl" class="rtl">اعضای یک پیکرند</bdi>” (limbs of one body).</p>
            <p class="src-theme">Others</p>
