<style>
  /* Philosophy as one night sky of influence: each mind a point, each line running down through time from an older mind
     to a younger one, colored by the tradition it starts in. */
  :root {
    --bg: #0f1526;
    --bg-deep: #0a0f1d;

    --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --pad: clamp(14px, 2.4vw, 28px);
    --card-w: 0px;
    --sheet-h: 0px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--bg); }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(70vmax 50vmax at 18% 0%, rgba(80, 100, 170, .16), transparent 70%),
      radial-gradient(60vmax 50vmax at 90% 100%, rgba(120, 70, 150, .12), transparent 70%),
      radial-gradient(120vmax 90vmax at 50% 50%, transparent 55%, rgba(4, 7, 16, .55));
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

  /* ---------- the chart ---------- */
  .stage { position: fixed; inset: 0; z-index: 0; touch-action: none; cursor: grab; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .stage.grabbing { cursor: grabbing; }
  #chart { display: block; width: 100%; height: 100%; }
  #chart text { fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }

  .t-ancient { --c: var(--ancient); } .t-east { --c: var(--east); } .t-india { --c: var(--india); }
  .t-islam { --c: var(--islam); } .t-west { --c: var(--west); } .t-source { --c: var(--source); }

  .edge { color: var(--c); opacity: .5; transition: opacity .4s ease; }
  .edge.t-west { opacity: .3; }
  .edge path { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
  .edge.weak path { stroke-dasharray: 1 4.5; stroke-width: 1.5; }

  .node { cursor: pointer; transition: opacity .4s ease; }
  .node .dot { fill: var(--c); stroke: var(--bg); stroke-width: 2.5; }
  .node .name { font-family: var(--serif); }
  .node .meta { font-family: var(--mono); font-size: 9.5px; fill: var(--mute); letter-spacing: .01em; stroke-width: 3px; }
  .node .ring { fill: none; stroke: var(--c); stroke-width: 1.2; opacity: 0; }
  .node .hit { fill: transparent; stroke: none; }
  .node.school .dot { fill: var(--bg); stroke: var(--c); stroke-width: 1.6; }
  .node.school .core { fill: var(--c); }
  .node.school .name { font-family: var(--sans); font-weight: 600; letter-spacing: .16em; fill: var(--c); }
  .node.src .dot { fill: var(--bg); stroke: var(--c); stroke-width: 1.5; }
  .node.src .name { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; fill: var(--c); }
  .node.end .name { font-family: var(--serif); font-style: italic; }
  .node.end .rule { stroke: var(--ink); stroke-width: 1; opacity: .5; }

  .margin text { font-family: var(--mono); font-size: 11px; fill: var(--mute); stroke: none !important; }
  .margin line { stroke: var(--ink); stroke-width: 1; opacity: .055; }
  .margin line.century { opacity: .09; }
  .finale text { stroke: none !important; }
  .finale .title { font-family: var(--serif); fill: var(--ink); }
  .finale .title tspan { font-style: italic; }
  .finale .sub { font-family: var(--mono); fill: var(--mute); letter-spacing: .04em; }
  .finale .credit { font-family: var(--mono); fill: var(--mute); opacity: .7; letter-spacing: .03em; }

  /* lineage: the chosen mind and everything that runs through it; the rest goes quiet */
  .lit .edge { opacity: .05; }
  .lit .node { opacity: .16; }
  .lit .edge.up, .lit .edge.down { opacity: .85; }
  .lit .edge.near { opacity: 1; }
  .lit .edge.near path { stroke-width: 2; }
  .lit .edge.path { opacity: 1; }
  .lit .edge.path path { stroke-width: 2.6; }
  .lit .edge.path.pending { opacity: 0; }
  .lit .node.up, .lit .node.down, .lit .node.sel, .lit .node.path { opacity: 1; }
  .lit .node.sel .ring, .lit .node.path.ends .ring, .lit .node.here .ring { opacity: 1; }
  .lit .node.here .ring { stroke-width: 2; }

  /* ---------- chrome ---------- */
  .glass { background: var(--panel); border: 1px solid var(--hair); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }

  }
  .back:hover, .back:focus-visible { background: var(--ink); color: var(--bg); outline: none; }
  .label { font: 400 .72rem/1.2 var(--mono); letter-spacing: .02em; color: var(--mute); padding: .62em 1em; border-radius: 999px; }
  .label .long { white-space: nowrap; }

  .find { position: relative; margin-left: auto; width: min(260px, 100%); }
  .find input, .tracer input {
    width: 100%; padding: .62em 1em .6em 2.3em; border: 1px solid var(--hair); border-radius: 999px; background: var(--panel);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    font: 400 .9rem/1.1 var(--sans); outline: none; -webkit-appearance: none; appearance: none;
  }
  .find input::placeholder, .tracer input::placeholder { color: var(--mute); }
  .find input:focus, .tracer input:focus { border-color: rgba(239, 232, 218, .5); }

  .hits {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 9; margin: 0; padding: 5px; list-style: none;
    background: #18213a; border: 1px solid var(--hair); border-radius: 14px; box-shadow: 0 18px 40px rgba(0, 0, 0, .45); max-height: 50svh; overflow: auto;
  }

  .hits li[aria-selected="true"], .hits li:hover { background: rgba(239, 232, 218, .1); }
  .tracer .hits { top: auto; bottom: calc(100% + 6px); }

  /* the years, held at the left edge when the sheet's own margin is out of view */
  .ruler { position: fixed; z-index: 3; left: 0; top: 0; bottom: 0; width: 70px; pointer-events: none; transition: opacity .3s ease; }
  .ruler span {
    position: absolute; left: calc(8px + env(safe-area-inset-left)); translate: 0 -50%; font: 400 .7rem/1 var(--mono); color: var(--mute);
    white-space: nowrap; background: rgba(15, 21, 38, .8); padding: 2px 4px; border-radius: 4px;
  }
  .ruler.off { opacity: 0; }

  .map {
    position: fixed; z-index: 4; right: calc(var(--pad) + var(--card-w) + env(safe-area-inset-right)); top: 50%; translate: 0 -50%;

    display: grid; grid-template-columns: 1fr auto; gap: .1rem .9rem; align-items: center;

  }
  .caption[hidden] { display: grid; opacity: 0; transform: translateY(12px); pointer-events: none; }
  .caption .step { font: 400 .68rem/1.3 var(--mono); color: var(--mute); letter-spacing: .02em; }
