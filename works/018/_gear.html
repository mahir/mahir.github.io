<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>No. 018 gear grid</title>
<style>
  html, body { margin: 0; background: #d9d8d2; color: #1b1a18; font: 11px/1.35 ui-monospace, Menlo, monospace; }
  #grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  figure { margin: 0; background: #e8e7e1; }
  figcaption { padding: 3px 6px 5px; width: 0; min-width: 100%; box-sizing: border-box; }
  canvas { display: block; }
  #err { color: #a00; white-space: pre-wrap; padding: 8px; }
</style>
</head>
<body>
<div id="err"></div>
<div id="grid"></div>
<script>
  window.onerror = (m, s, l, c, e) => { document.getElementById('err').textContent += (e && e.stack || m) + '\n'; };
  window.addEventListener('unhandledrejection', (e) => { document.getElementById('err').textContent += (e.reason && e.reason.stack || e.reason) + '\n'; });
</script>
<script type="module">
// ?kind=wheels,legs  ?obj=box,cyl,wedge  ?size=s,l  ?seed=  ?v=<gear variant>  ?w= ?h=  ?az=
import { makeScene } from './fleet.js';
import * as K from './kit.js';
import * as G from './classes/gear.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 300), H = +(q.get('h') || 220);
const DPR = Math.min(2.5, window.devicePixelRatio || 1);
const WEIGHT = [0.38, 0.55, 0.8, 1.2];
const grid = document.getElementById('grid');
const kinds = q.get('kind') ? q.get('kind').split(',') : G.KINDS;
const objs = q.get('obj') ? q.get('obj').split(',') : ['box', 'cyl', 'wedge'];
const sizes = q.get('size') ? q.get('size').split(',') : ['s', 'l'];
const seed0 = +(q.get('seed') || 1);
const nSeeds = +(q.get('n') || 1);
if (q.get('v')) G.test.gearVariant = q.get('v');

const OBJ = {
  box: { s: [2.4, 1.3, 1.5, 0.8], l: [9, 5, 5.5, 30], round: false },
  cyl: { s: [1.4, 1.4, 2.6, 0.9], l: [6, 6, 11, 40], round: true },
  wedge: { s: [3.2, 1.2, 0.9, 0.6], l: [14, 4.5, 3.4, 25], round: false },
};

function stand(M, kind, L, Wd, Hh) {
  M.part('OBJECT', () => {
    if (kind === 'box') {
      const S = M.box([-L / 2, -Wd / 2, 0], [L / 2, Wd / 2, Hh]);
      for (const k of ['+x', '-x', '+y', '-y']) { const f = S.f(k); for (const r of f.grid(3, 2)) K.fill(f, r, (r.i + r.j) % 2 ? 'corrugated' : 'plain'); }
    } else if (kind === 'cyl') {
      const S = M.cyl(Wd / 2, 0, Hh * 0.85);
      S.lat.shade({}); S.lat.ring(0.3); S.lat.ring(0.6);
      M.at(0, 0, Hh * 0.85, () => M.sphere(Wd / 2, { a1: 180 }) && null);
      M.cone(Wd * 0.5, Wd * 0.08, Hh * 0.85, Hh);
    } else {
      const S = M.extrude([[-L / 2, 0], [L / 2, 0], [L / 2, Hh * 0.25], [-L * 0.1, Hh], [-L / 2, Hh]], -Wd / 2, Wd / 2, { plane: 'xz' });
      for (const k of ['-y', '+y']) { const f = S.f(k); K.corrugated(f, [-f.w * 0.4, -f.h * 0.4, f.w * 0.1, f.h * 0.3]); }
    }
  });
  M.info.mass = [-L / 2, -Wd / 2, 0, L / 2, Wd / 2, Hh];
}

function paint(d, label) {
  const fig = document.createElement('figure');
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d');
  g.scale(DPR, DPR);
  g.fillStyle = '#e8e7e1'; g.fillRect(0, 0, W, H);
  g.translate(W / 2, H / 2);
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const s of d.strokes) {
    g.strokeStyle = '#1b1a18';
    g.globalAlpha = s.pass === 0 ? 0.35 : s.w === 0 ? 0.75 : 1;
    g.lineWidth = WEIGHT[s.w];
    g.setLineDash(s.dash === 'dash' ? [4, 3] : s.dash === 'chain' ? [9, 2.5, 1.5, 2.5] : []);
    const p = s.pts;
    g.beginPath(); g.moveTo(p[0], p[1]);
    for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]);
    g.stroke();
  }
  g.globalAlpha = 1; g.setLineDash([]);
  if (q.has('callouts')) {
    g.fillStyle = '#c33';
    for (const c of d.callouts || []) { g.beginPath(); g.arc(c.x, c.y, 2, 0, 7); g.fill(); g.fillText(c.label, c.x + 3, c.y - 2); }
  }
  fig.appendChild(cv);
  const cap = document.createElement('figcaption');
  cap.innerHTML = label;
  fig.appendChild(cap);
  grid.appendChild(fig);
}

const stats = {};
for (const kind of kinds) for (const ob of objs) for (const sz of sizes) for (let k = 0; k < nSeeds; k++) {
  const seed = seed0 + k;
  const [L, Wd, Hh, mass] = OBJ[ob][sz];
  let info = {};
  const build = (M) => {
    M.setView(+(q.get('az') || M.pick([38, -38, 142, -142])), 28);
    G.test.gear = kind;
    const g = G.plan(M, { len: L, wid: Wd, hgt: Hh, mass, round: OBJ[ob].round });
    M.at(0, 0, g.z, () => stand(M, ob, L, Wd, Hh));
    const mb = M.info.mass; M.info.mass = [mb[0], mb[1], mb[2] + g.z, mb[3], mb[4], mb[5] + g.z];
    const gi = g.build();
    info = { g, gi };
    return { float: g.float, figure: gi.figure, drops: gi.drops };
  };
  const t = performance.now();
  let d;
  try { d = makeScene(build, { w: W, h: H }, { seed, extras: true }); } catch (e) { document.getElementById('err').textContent += `${kind} ${ob} ${sz}: ${e.stack}\n`; continue; }
  const ms = performance.now() - t;
  const { g, gi } = info;
  (stats[kind] = stats[kind] || []).push([ms, d.stats.segments]);
  paint(d, `<b>${kind}</b> ${g.variant || ''} · ${ob} ${sz} · ${g.goes} · z ${g.z.toFixed(2)} · ${ms.toFixed(0)} ms ${d.stats.segments} seg<br>${g.form} / ${g.adj} / ${g.family}${g.float ? ' float' : ''} · ${gi.specs.map((s) => s.join(' ')).join(', ')} · ${d.callouts.map((c) => c.label).join(', ')}`);
}
const p = document.createElement('pre');
p.style.padding = '0 8px';
p.textContent = Object.entries(stats).map(([k, a]) => `${k}: max ${Math.max(...a.map((x) => x[0])).toFixed(0)} ms, max ${Math.max(...a.map((x) => x[1]))} seg`).join('\n');
document.body.appendChild(p);
window.gearStats = stats;
</script>
</body>
</html>
