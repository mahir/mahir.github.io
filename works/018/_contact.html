<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>No. 018 contact sheet</title>
<style>
  :root { --paper: #e8e7e1; --ink: #1b1a18; }
  html, body { margin: 0; background: #d9d8d2; color: var(--ink); font: 11px/1.35 ui-monospace, Menlo, monospace; }
  #grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; }
  figure { margin: 0; background: var(--paper); }
  figcaption { padding: 4px 6px 6px; display: flex; gap: 4px 10px; flex-wrap: wrap; width: 0; min-width: 100%; box-sizing: border-box; }
  figcaption b { font-weight: 600; }
  canvas { display: block; }
  #err { color: #a00; white-space: pre-wrap; padding: 10px; }
</style>
</head>
<body>
<div id="err"></div>
<div id="grid"></div>
<script>
  window.onerror = (m, s, l, c, e) => { document.getElementById('err').textContent += (e && e.stack || m) + '\n'; };
  window.addEventListener('unhandledrejection', (e) => { document.getElementById('err').textContent += (e.reason && e.reason.stack || e.reason) + '\n'; });
</script>
<script type="module">
import { make, makeScene, classes } from './fleet.js';
import * as K from './kit.js';
// test hooks for the running gear: ?gear=<kind> forces the kind, ?variant=<name> the object
const GEAR = await import('./classes/gear.js').catch(() => null);
{ const q0 = new URLSearchParams(location.search); if (GEAR) { GEAR.test.gear = q0.get('gear') || null; GEAR.test.variant = q0.get('variant') || null; GEAR.test.gearVariant = q0.get('gv') || null; } }

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 560), H = +(q.get('h') || 380);
const DPR = Math.min(2.5, window.devicePixelRatio || 1);
const WEIGHT = [0.38, 0.55, 0.8, 1.2];
const grid = document.getElementById('grid');

function paint(d, w, h, label) {
  const fig = document.createElement('figure');
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const g = cv.getContext('2d');
  g.scale(DPR, DPR);
  g.fillStyle = '#e8e7e1'; g.fillRect(0, 0, w, h);
  g.translate(w / 2, h / 2);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const showPass = q.get('pass') ? q.get('pass').split(',').map(Number) : null;
  for (const s of d.strokes) {
    if (showPass && !showPass.includes(s.pass)) continue;
    g.strokeStyle = '#1b1a18';
    g.globalAlpha = s.pass === 0 ? 0.35 : s.w === 0 ? 0.75 : 1;
    g.lineWidth = WEIGHT[s.w];
    g.setLineDash(s.dash === 'dash' ? [4, 3] : s.dash === 'chain' ? [9, 2.5, 1.5, 2.5] : []);
    const p = s.pts;
    g.beginPath();
    g.moveTo(p[0], p[1]);
    for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]);
    g.stroke();
  }
  g.globalAlpha = 1; g.setLineDash([]);
  if (q.has('callouts')) {
    g.fillStyle = '#c33';
    for (const c of d.callouts || []) { g.beginPath(); g.arc(c.x, c.y, 2.5, 0, 7); g.fill(); g.fillText(c.label + ' ' + c.qty, c.x + 4, c.y - 3); }
  }
  if (q.has('bbox') && d.bbox) { g.strokeStyle = '#c33'; g.lineWidth = 0.5; g.strokeRect(d.bbox.x0, d.bbox.y0, d.bbox.x1 - d.bbox.x0, d.bbox.y1 - d.bbox.y0); }
  fig.appendChild(cv);
  const cap = document.createElement('figcaption');
  cap.innerHTML = label;
  fig.appendChild(cap);
  grid.appendChild(fig);
}

function caption(d) {
  const m = d.meta || {};
  const st = d.stats;
  return `<b>${d.seed}</b> <span>${m.klass || ''}</span> <span>${m.name || ''} ${m.designation || ''}</span>
    <span>${st.strokes} strokes / ${st.segments} seg</span> <span>${st.msMake.toFixed(0)} ms</span>
    <span>${(d.pxPerMeter).toFixed(1)} px/m</span>` + (q.has('v') ? `<br><span>${m.brief}</span> <span>${(m.specs || []).map((s) => s.join(' ')).join(' · ')}</span><br><span>${d.callouts.map((c) => c.label + ' ' + c.qty).join(' · ')}</span>` : '');
}

// ---------------------------------------------------------------- kit parts and engine cases
const KIT = {
  'box + chamfer': (M) => { M.box([-2, -1.5, 0], [2, 1.5, 2.5]); M.at(0, 4, 0, () => M.box([-1.5, -1.5, 0], [1.5, 1.5, 2.5], { chamfer: 0.6 })); },
  'corrugated / plain': (M) => { const S = M.box([-2, -2, 0], [2, 2, 3]); for (const k of ['+x', '-y', '+y', '-x']) { const f = S.f(k); for (const r of f.grid(2, 2)) (r.i + r.j) % 2 ? K.corrugated(f, r) : K.plain(f, r); } },
  'xWindow': (M) => { const S = M.box([-2, -2, 0], [2, 2, 3]); for (const k of ['+x', '-y', '+y', '-x']) { const f = S.f(k); for (const r of f.grid(2, 1)) K.xWindow(f, r); } },
  'octPort / porthole': (M) => { const S = M.box([-2, -2, 0], [2, 2, 3]); for (const k of ['+x', '-y', '+y', '-x']) { const f = S.f(k); const g = f.grid(2, 1); K.octPort(f, g[0], { mullion: '+' }); K.fill(f, g[1], 'porthole'); } },
  'louver / hatch': (M) => { const S = M.box([-2, -2, 0], [2, 2, 3]); for (const k of ['+x', '-y', '+y', '-x']) { const f = S.f(k); const g = f.grid(2, 1); K.louver(f, g[0]); K.accessHatch(f, g[1]); } },
  'door + platform': (M) => { const S = M.box([-3, -3, 2], [3, 3, 6]); for (const k of ['+x', '-y', '+y', '-x']) { const f = S.f(k); K.door(M, f, 0, -f.h / 2 + 1.2, 1.2, 2.0, { platform: true }); } },
  'stencil': (M) => { const S = M.box([-3, -1, 0], [3, 1, 2]); K.stencil(S.f('-y'), 'HB-XFP', 0, 0, 0.7); K.stencil(S.f('+y'), 'MK IV', 0, 0, 0.7); K.stencil(S.f('+z'), '07', 0, 0, 1.2, { upright: true }); K.stencil(S.f('+x'), 'A', 0, 0, 1); },
  'leg + footpad': (M) => { K.leg(M, { top: [[0, 0, 4], [0.4, 0, 3]], foot: [3.5, 0, 0.6], r: 0.14 }); M.at(3.5, 0, 0, () => K.footpad(M)); M.box([-2, -1.5, 2.6], [0.2, 1.5, 5]); },
  'ladder / railing': (M) => { K.ladder(M, { h: 3 }); K.railing(M, [[1, -2, 0], [3, -2, 0], [3, 2, 0]]); },
  'catwalk / stairs': (M) => { K.catwalk(M, { len: 4, w: 1.2 }); M.at(0, 3, 0, () => K.stairs(M, { len: 3, h: 2 })); },
  'girder 3 / 4': (M) => { K.girder(M, [0, 0, 0], [6, 0, 2], { w: 0.6, sec: 4 }); K.girder(M, [0, 2, 0], [0, 2, 5], { w: 0.7, sec: 3 }); },
  'ring girder': (M) => { K.ringGirder(M, { r: 3, h: 0.4 }); },
  'wheel / twin': (M) => { K.wheel(M, { r: 0.8, w: 0.5 }); M.at(2.5, 0, 0, () => K.twinWheel(M, { r: 0.7, w: 0.35 })); },
  'bogie / rocker': (M) => { K.bogie(M, { n: 2, pitch: 1.8, r: 0.45 }); M.at(0, 3.5, 0.5, () => K.rocker(M, { len: 2.2, r: 0.45 })); },
  'track': (M) => { K.track(M, { len: 5, r: 0.6, w: 0.6 }); },
  'dish / whip / radar': (M) => { K.dishMount(M, { r: 1.2, el: 40 }); M.at(2.5, 0, 0, () => K.whip(M, { h: 3, lean: 15 })); M.at(0, 3, 0, () => K.radar(M, { len: 2.4 })); },
  'lamp / searchlight / horn': (M) => { K.lamp(M, { r: 0.25 }); M.at(1.5, 0, 0, () => K.searchlight(M, { r: 0.4 })); M.at(0, 1.6, 0.4, () => K.horn(M, { r: 0.3 })); },
  'tanks': (M) => { M.at(0, 0, 0.9, () => K.tankCapsule(M, { r: 0.8, len: 3.4 })); M.at(0, 3, 0, () => K.tankSphere(M, { r: 1 })); },
  'pipes / stack': (M) => { K.pipeRun(M, [[0, 0, 0], [0, 0, 2], [2, 0, 2], [2, 2, 2.5], [2, 2, 0]], 0.12); M.at(-1.5, 2, 0, () => K.stack(M, { r: 0.35, h: 3 })); },
  'bell / nozzles': (M) => { M.at(0, 0, 2, () => K.bell(M, { r: 0.8 })); M.at(0, 3.5, 2, () => K.nozzles(M, { n: 4, r: 0.4 })); },
  'solar panel': (M) => { M.at(0, 0, 1.5, () => M.ry(20, () => K.solar(M, { w: 4, h: 1.6 }))); M.tube([0, 0, 0], [0, 0, 1.4], 0.06); },
  'crane / winch': (M) => { K.crane(M, { len: 5, rise: 35 }); M.at(0, 3, 0, () => K.winch(M, { r: 0.35, w: 0.9 })); },
  'crate / container': (M) => { K.crate(M); M.at(0, 3, 0, () => K.container(M, { len: 6.06, label: 'KESTREL' })); },
  'cupola / canopy': (M) => { K.cupola(M, { r: 1.2 }); M.at(0, 3.5, 0, () => K.canopy(M, { len: 2.4, w: 1.4, h: 1 })); },
  'rotor / propeller / fan': (M) => { M.at(0, 0, 1, () => K.rotor(M, { r: 2, blades: 4 })); M.at(0, 4, 1.5, () => K.propeller(M, { r: 1.2 })); M.at(0, 7, 1.5, () => K.ductedFan(M, { r: 1.1 })); },
  'helipad': (M) => { M.at(0, 0, 1, () => K.helipad(M, { r: 4 })); },
  'mini helicopter': (M) => { K.miniHeli(M, { len: 8, reg: 'HB-XFP' }); },
  'figure / drop lines': (M) => { M.rz(M.view.az + 90, () => K.figure(M)); M.at(3, 0, 3, () => M.box([-1, -1, 0], [1, 1, 1])); K.dropLines(M, [[2, -1, 3], [4, -1, 3], [4, 1, 3], [2, 1, 3]]); },
};
const TESTS = {
  'flush drum on deck': (M) => { const D = M.box([-3, -3, 0], [3, 3, 1]); for (const r of D.f('+z').grid(4, 4)) K.corrugated(D.f('+z'), r, { dir: 'h' }); const C = M.cyl(1.2, 1, 3); C.lat.shade({}); M.at(2, 2, 1, () => M.cyl(0.4, 0, 0.8)); },
  'strut into hull': (M) => { M.box([-2, -2, 1], [2, 2, 4]); M.tube([4, 3, 0], [0, 0, 3], 0.25); M.tube([-4, 1, 0], [0, -1, 2], 0.3); M.tube([0, -4, 5], [0, 0, 3], 0.2); },
  'concave extrude': (M) => { const S = M.extrude([[0, 0], [5, 0], [5, 1], [3.5, 1], [3, 2.2], [1, 2.2], [0.5, 1], [0, 1]], -1, 1, { plane: 'xz' }); K.corrugated(S.f('-y'), [-1.5, -0.6, 1.5, 0.3]); K.corrugated(S.f('+y'), [-1.5, -0.6, 1.5, 0.3]); M.at(2, 0, 2.2, () => M.cyl(0.3, -0.5, 1.2)); },
  'mirrored parts': (M) => { M.mirrorY((s) => M.at(0, 1.5, 0, () => { const S = M.box([-1, 0, 0], [1, 1, 1.5]); K.stencil(S.f('+y'), 'AB', 0, 0, 0.5); K.xWindow(S.f('+x'), S.f('+x').box); M.tube([0, 0.5, 1.5], [0, 2, 3], 0.08); })); },
  'lathe near silhouette': (M) => { const S = M.sphere(2); S.lat.ring(0.5); S.lat.ring(0.3); S.lat.ring(0.7); for (let a = 0; a < 360; a += 30) S.lat.meridian(a, 0.05, 0.95); M.at(0, 0, 0, () => M.box([1.2, -0.3, -0.3], [2.6, 0.3, 0.3])); },
  'torus + spheres': (M) => { M.torus(2, 0.5); M.at(0, 0, 0.6, () => M.sphere(1)); M.at(3, 0, 0, () => M.scale(1.6, 0.8, 0.8, () => M.sphere(1))); },
  'cylinder through roof': (M) => { M.extrude([[-3, 0], [3, 0], [3, 2], [0, 3.5], [-3, 2]], -2, 2, { plane: 'xz' }); M.cyl(0.4, 1, 4.5); M.at(-1.5, 0, 0, () => M.cyl(0.25, 1.5, 4.2)); },
  'open dish + plates': (M) => { M.at(0, 0, 1, () => K.dish(M, { r: 2 })); M.at(0, 3, 0, () => M.plate([[0, 0, 0], [2, 0, 0], [2, 0, 2], [0, 0, 2]])); M.at(0, 2, 1, () => M.box([0.5, 0, 0], [1.5, 2, 0.3])); },
  'coplanar stack': (M) => { M.box([0, 0, 0], [3, 3, 1]); M.box([0, 0, 1], [3, 3, 2]); M.box([0.5, 0.5, 2], [2.5, 2.5, 2.6]); M.box([3, 0, 0], [4, 3, 2]); },
};

function scene(name, fn, w, h) {
  const t = performance.now();
  let d;
  try { d = makeScene(fn, { w, h }, { seed: 7 }); } catch (e) { document.getElementById('err').textContent += name + ': ' + e.stack + '\n'; return; }
  paint(d, w, h, `<b>${name}</b> <span>${d.stats.strokes} strokes / ${d.stats.segments} seg</span> <span>${(performance.now() - t).toFixed(0)} ms</span>`);
}

if (q.has('kit') || q.has('tests')) {
  const set = q.has('kit') ? KIT : TESTS;
  const only = q.get('kit') || q.get('tests');
  for (const [name, fn] of Object.entries(set)) if (!only || name.includes(only)) scene(name, fn, +(q.get('w') || 340), +(q.get('h') || 260));
} else if (q.has('one')) {
  const seed = +q.get('one');
  const d = make(seed, { w: W, h: H }, { klass: q.get('class') });
  paint(d, W, H, caption(d));
  window.drawing = d;
} else {
  const n = +(q.get('n') || 12), s0 = +(q.get('seed') || 100);
  const times = [];
  for (let i = 0; i < n; i++) {
    const d = make(s0 + i, { w: W, h: H }, { klass: q.get('class') });
    times.push(d.stats.msMake);
    paint(d, W, H, caption(d));
  }
  const sorted = times.slice().sort((a, b) => a - b);
  document.title = `contact ${n}: median ${sorted[n >> 1].toFixed(0)} ms, max ${sorted[n - 1].toFixed(0)} ms`;
  const p = document.createElement('div');
  p.style.padding = '0 10px 10px';
  p.textContent = `${classes.length} classes. make(): median ${sorted[n >> 1].toFixed(0)} ms, max ${sorted[n - 1].toFixed(0)} ms`;
  document.body.appendChild(p);
}
</script>
</body>
</html>
