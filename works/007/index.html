  .back:hover { border-color: var(--ink); }
  .nav .label { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

  .caption { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; pointer-events: none; }
  .what { margin: 0; min-width: 0; }
  .what b { display: block; font-size: 1.05rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  .what span { display: block; font-size: .95rem; color: var(--faint); }
  .act { display: flex; flex: none; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; }
  .step { font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  button { font: inherit; font-size: .85rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; line-height: 1;

  button:hover { background: #fff; }
  button:focus-visible, .back:focus-visible { outline: 2px solid #5fc4c6; outline-offset: 3px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #1f3f96; transform: scaleX(0); transform-origin: left; }
