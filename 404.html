  :root { --bg: #06070b; --ink: #e2e6eb; --dim: rgba(226, 230, 235, .7); --faint: rgba(226, 230, 235, .58); --hair: rgba(226, 230, 235, .13); --accent: #5b8cff; color-scheme: dark; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 400 16px/1.5 "Archivo", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  p { margin: 0 0 1.6rem; color: var(--dim); }
  nav { display: flex; flex-wrap: wrap; gap: .4rem 1.6rem; }
  nav a { padding: .45rem 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: .45em; }
  nav a:hover, nav a:focus-visible { text-decoration-color: var(--accent); }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
