# Just after midnight in New York, put up the work dated today, if there is one: works/_build.py features it
# on the homepage and refreshes the list, sitemap and llms.txt. On days without a new work nothing changes
# and nothing is committed. Two times cover both daylight and standard time.
name: Put up today's work
on:
  schedule:
    - cron: '5 4,5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 works/_build.py
      - name: Commit and publish if a work went up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No new work today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Put up today's work"
          git push
          # a push made with the workflow's token may not start a Pages build by itself
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
