# Just after midnight in New York, put up the work dated today, if there is one: works/_build.py features it
# on the homepage and refreshes the list, sitemap and llms.txt. It also refreshes the closing prices No. 005 is
# drawn from, so after a trading day there is a commit even without a new work. On days with neither, nothing
# changes and nothing is committed. Two times cover both daylight and standard time.
# It can't pick up new Substack posts: Substack refuses GitHub's servers, so the build keeps the posts already
# listed. Those are refreshed by hand after a post goes up (see works/README.md).
name: Put up today's work
on:
  schedule:
    - cron: '5 4,5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a failed fetch keeps yesterday's prices and never stops the build
      - name: Refresh No. 005's prices
        run: python3 works/005/_prices.py
        continue-on-error: true
      - run: python3 works/_build.py
      - name: Commit and publish if a work went up or the prices changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No new work today, and no new prices."
            exit 0
          fi
          message="Put up today's work"
          if git diff --quiet -- . ':!works/005/prices.json'; then message="Refresh No. 005's prices"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$message"
          git push
          # a push made with the workflow's token may not start a Pages build by itself
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
